name: hadolint

# Dockerfile の lint leaf。リポジトリ全体を recursive で見る。
#
# オーケストレーターは ci.yaml で、必須チェックはそこの `CI Gate` 1 個だけ。
# 直接のトリガーは持たない — leaf 自身が pull_request で起動すると、同じ
# コミットに対して gate 経由の結果と重複した check run が並ぶ。
on:
  workflow_call:

permissions: {}

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
