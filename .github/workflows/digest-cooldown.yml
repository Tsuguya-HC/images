name: Digest cooldown

# The action moved to Tsuguya-HC/digest-cooldown. pull_request_target, not
# pull_request: the workflow definition then comes from main, so a PR cannot
# weaken the gate that is judging it. The action never checks out or runs
# head-side code — it reads the diff over the API.

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  # マージキューの一時 commit にも報告する。action は merge_group では diff を
  # 再評価せず、PR head で確定済みの status を転記する。
  merge_group:

permissions: {}

concurrency:
  group: digest-cooldown-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || 'scan' }}
  cancel-in-progress: false

jobs:
  cooldown:
    name: Digest cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write # post the digest-cooldown commit status
      pull-requests: write # store first-seen instants in a PR comment
      contents: read # read the diff
    steps:
      - uses: Tsuguya-HC/digest-cooldown@7c1f020a6dccaf3a8daff6b34fafafe3743a6429 # v1.2.0
        with:
          cooldown-days: 3
          skip-registries: registry.infra.tgy.io,ghcr.io/tsuguya-hc
          gate-version-bumps: true
          gate-authors: renovate[bot]
          always-report: true
