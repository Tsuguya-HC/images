name: CI

# 必須ステータスチェックを単一 gate に集約するオーケストレーター。
# 各検査は workflow_call の leaf にあり、ここはそれを組み立てるだけ。
# ruleset に登録する必須チェックは末尾の `CI Gate` 1 個。
#
# トリガーに paths フィルタは付けない。かつて hadolint は
# `paths: ["**/Dockerfile"]` で絞られていたが、集約ジョブを必須チェックにする
# 以上その形は使えない — paths に一致しない PR ではジョブが起動せず、必須
# コンテキストが永久に "Waiting for status to be reported" のまま詰まる。
#
# 代わりに起動は常にして、`detect` が leaf ごとの実行要否を出す。skip した
# leaf は gate から見て `skipped` = 合格扱いになるので、報告は常に発生する。
# 「Dockerfile を触らない PR で hadolint を省く」という当初の意図は、
# トリガーではなくここで実現する。
on:
  pull_request:
    branches: [main]
    # `edited` on top of the default opened/synchronize/reopened. Changing a
    # PR's base is an `edited` activity, so a PR opened against another branch
    # and later retargeted at main never matched `branches:` and never produced
    # a CI Gate check at all — the required context stays "Expected — Waiting
    # for status to be reported" and the PR cannot merge until someone pushes
    # to it.
    #
    # detect を入れたことで、もう 1 つ塞ぐものが増えた。retarget では head SHA
    # が変わらないので、`edited` が無いと旧 base で計算した detect の結果
    # （= leaf を skip した緑）がそのまま新 base の必須チェックに流用できる。
    types: [opened, synchronize, reopened, edited]
  # マージキューは main に対する一時 commit（gh-readonly-queue/main/pr-N-<sha>）
  # の上で必須チェックを取り直す。ここで報告しないとキューの entry は永久に待つ。
  # detect の dorny/paths-filter は merge_group を base_sha..head_sha で解釈する。
  merge_group:

permissions: {}

concurrency:
  # merge_group には event.number が無いので ref（キューの一時ブランチ）で分ける。
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 変更ファイル種別を判定し、各 leaf を実行すべきかを outputs で返す。
  # merge-base 等のエッジケースを正しく扱うため dorny/paths-filter を使う。
  #
  # leaf 自身のワークフローファイルも各フィルタに入れてある（自己参照）。leaf の
  # 中身を変えた PR がその leaf を走らせないのでは検証にならない。
  detect:
    name: detect changes
    # checkout と paths-filter しか動かないので slim で足りる。ツールを要求
    # するのは leaf 側で、そちらは ubuntu-latest のまま。
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter が PR の変更ファイル一覧を API 取得するために必要
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - '**/Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/_hadolint.yml'
              - '.github/workflows/_claude-code-smoke.yml'
              - 'claude-code/smoke-test.sh'
              - 'claude-code/**'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'
            renovate:
              - 'renovate.json*'

  hadolint:
    needs: detect
    if: ${{ needs.detect.outputs.docker == 'true' }}
    # zizmor 1.30 の self-repository は `./` を `$/` にしろと言う。従わないのは、
    # `$/` にすると actionlint が呼び出しを解決できなくなり、reusable workflow の
    # input 検証（必須の欠落・存在しない input 名）がまるごと消えるから（実測）。
    # audit の根拠である「前段ステップが clone したものを掴む」も、job レベルの
    # 呼び出しには当たらない — GitHub が同じ commit から解決し FS を見ない。
    # ignore は行単位。ステップの `uses: ./my-action` は今も検出される。
    uses: ./.github/workflows/_hadolint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # claude-code の build + スモークテスト。3 イメージ共通化はしない — argo-tools /
  # talos-tools は alpine のままで、対象を広げるとこの PR の範囲を超える。
  claude-code-smoke:
    needs: detect
    if: ${{ needs.detect.outputs.docker == 'true' }}
    uses: ./.github/workflows/_claude-code-smoke.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # ワークフロー自身の検査。actionlint と zizmor のピンは home-actions 側にあり、
  # ここは呼び先の SHA を追うだけ。aqua.yaml は要らない（共有ワークフローが
  # AQUA_CONFIG で自分の _tooling/aqua.yaml を使う）。
  lint-workflows:
    needs: detect
    if: ${{ needs.detect.outputs.workflows == 'true' }}
    uses: Tsuguya-HC/home-actions/.github/workflows/lint-workflows.yml@e104faf579d998450923e65f0d47a4ef790b8abd # v1.3.0
    permissions:
      contents: read

  # Renovate は知らないキーを黙って捨てる。このリポジトリは二重エスケープした
  # 正規表現で crane と container-structure-test を取りこぼしていた。
  lint-renovate:
    needs: detect
    if: ${{ needs.detect.outputs.renovate == 'true' }}
    uses: Tsuguya-HC/home-actions/.github/workflows/lint-renovate.yml@e104faf579d998450923e65f0d47a4ef790b8abd # v1.3.0
    permissions:
      contents: read

  # 必須チェックはこれ 1 個だけを ruleset に登録する。個別ジョブ名を必須化すると、
  # 名前を変えた瞬間に報告されない必須コンテキストが残って PR が永久に止まる。
  #
  # `detect` も needs に含める。detect が失敗すると全 leaf の `if` が偽になって
  # skip され、skip は合格扱いなので、detect を見ていないと「何も検査していない
  # 緑」が必須チェックを満たしてしまう。
  gate:
    name: CI Gate
    needs: [detect, lint-workflows, lint-renovate, hadolint, claude-code-smoke]
    # `always()` ではなく `!cancelled()`。always() だと run をキャンセルしたとき
    # 全ての leaf が `cancelled` を返し、下の case をすり抜けて必須チェックが
    # 失敗として記録される。
    if: ${{ !cancelled() }}
    # 集計は bash の for ループだけなので slim で足りる。
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: needs が空だとループが素通りして緑になる
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were correctly skipped."
